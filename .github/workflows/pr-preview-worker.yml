name: PR Preview (worker)

on:
    workflow_run:
        workflows: ['PR Preview']
        types: [completed]

jobs:
    pr-preview-fork-deploy:
        permissions:
            contents: read
            actions: read

        runs-on: ubuntu-latest

        steps:
            - name: PR preview (worker)
              uses: open-resource-discovery/pr-preview-action@e89b5e39a6445cce283f7b1162224de428bedb53 # main
              with:
                  token: ${{ secrets.PR_PREVIEW_TOKEN }}
